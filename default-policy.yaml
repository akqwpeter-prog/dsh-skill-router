# dsh-skill-router policy — copy to ~/.dsh/skill-router.yaml and edit.
# First matching rule wins. `pour` = skill names to load.
rules:
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/docx/"
    pour: [lark-doc]
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/wiki/"
    pour: [lark-wiki]
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/drive/"
    pour: [lark-drive]
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/sheets/"
    pour: [lark-sheets]
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/base/"
    pour: [lark-base]
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/slides/"
    pour: [lark-slides]
  - match: "(feishu\\.cn|larksuite\\.com|doubao\\.com)/mindnotes/"
    pour: [lark-markdown]
  - match: "(生成|画|做|创作|来一张)[^。\\n]{0,12}(图|插画|海报|banner|封面|头像|背景)|poster|banner|image\\s+gen"
    pour: [media-tools]
  - match: "(看|读|检查|分析|描述|识别)[^。\\n]{0,10}(图|截图|界面|logo|水印|照片|设计稿)|视觉检查|ui\\s?检查"
    pour: [vision-review]
  - match: "派[^。\\n]{0,6}(codex|claude|trae|opencode|gemini|cursor|kimi|qwen|copilot|workbuddy|grok)|让[^。\\n]{0,8}(codex|claude\\s?code|trae|opencode|gemini)[^。\\n]{0,6}(干|做|写|查|分析)"
    pour: [conductor]
  - match: "会议纪要.{0,8}(周报|总结|整理)|整理.{0,4}会议|会议周报|meeting.{0,10}summary"
    pour: [lark-workflow-meeting-summary]
  - match: "((今天|本周|明天|近期).{0,6}(安排|日程|待办|计划))|((安排|日程|待办).{0,6}(今天|本周|明天))"
    pour: [lark-workflow-standup-report]
  - match: "审批(待办|实例|申请|流程|定义|单)?"
    pour: [lark-approval]
  - match: "(发|send)[^。\\n]{0,6}(消息|信息)|聊天记录|群聊"
    pour: [lark-im]
  - match: "(发|写|查|收|看)[^。\\n]{0,6}(邮件|email)|收件箱|草稿"
    pour: [lark-mail]
  - match: "日历|日程|会议室|订会|安排会议"
    pour: [lark-calendar]
  - match: "已结束.{0,6}会议|历史会议|会议.{0,8}(逐字稿|纪要|记录)"
    pour: [lark-vc]
  - match: "多维表格|bitable"
    pour: [lark-base]
  - match: "电子表格|excel"
    pour: [lark-sheets]
  - match: "okr|目标与关键结果"
    pour: [lark-okr]
